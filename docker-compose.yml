services:
  dessertbyfir-web:
    container_name: dessertbyfir_web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL wajib diisi di .env}
    image: dessertbyfir-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Wajib untuk adapter-node (CSRF check form actions) di belakang reverse proxy
      - ORIGIN=${ORIGIN:-https://dessertbyfir.com}
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-10M}
    # Tidak expose port ke host; diakses lewat Nginx Proxy Manager (network nginx_proxy)
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nginx_proxy

networks:
  nginx_proxy:
    external: true
